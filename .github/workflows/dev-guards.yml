name: dev-guards

# The tooling guard: workflow lint (actionlint + zizmor), the axe-core
# accessibility gate over woven players, and visual regression on the
# woven sample. PR-only (+ manual dispatch) so main-push green-ness
# stays ci.yml's job; these gates protect the *process* surfaces.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes (2026-10-17: ~35 min/day went to stale runs). Pushes to
# main are grouped by commit, so a main run is never cancelled: it is the check of two merges landing together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: actionlint + zizmor on workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (checksum-verified release binary)
        run: |
          set -euo pipefail
          V=1.7.12
          curl -sSLf -o "actionlint_${V}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_linux_amd64.tar.gz"
          curl -sSLf -o al.sum "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_checksums.txt"
          sha256sum -c <(grep "actionlint_${V}_linux_amd64.tar.gz" al.sum)
          tar -xzf "actionlint_${V}_linux_amd64.tar.gz" actionlint
          ./actionlint .github/workflows/*.yml

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: zizmor (pinned via uv tool run)
        run: uv tool run zizmor==1.30.1 .github/

  a11y:
    name: axe-core gate on woven players
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --group test

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Weave the sample + the kitchen fixture
        run: |
          set -euo pipefail
          mkdir -p /tmp/weave
          uv run ratatoskr weave --pack sample-world --out /tmp/weave/sample.html
          PACK=$(python3 tests/fixtures/make_kitchen_pack.py /tmp/weave/kitchen-home)
          uv run ratatoskr weave --pack "$PACK" --out /tmp/weave/kitchen.html
          DPACK=$(python3 tests/fixtures/make_desk_pack.py /tmp/weave/desk-home)
          uv run ratatoskr weave --pack "$DPACK" --out /tmp/weave/desk.html

      - name: axe-core (vendored, MPL-2.0)
        run: uv run python scripts/a11y_check.py /tmp/weave/sample.html /tmp/weave/kitchen.html /tmp/weave/desk.html

  browser:
    name: browser tests (studio as a person uses it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --group test

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Browser tests
        env:
          VEFR_BROWSER_REQUIRED: "1"
        run: uv run pytest -q tests/browser

  visual:
    name: visual regression on woven sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --group test

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Weave the sample
        run: |
          set -euo pipefail
          mkdir -p /tmp/weave
          uv run ratatoskr weave --pack sample-world --out /tmp/weave/sample.html

      - name: Compare against committed baseline
        run: uv run python scripts/visual_regress.py /tmp/weave/sample.html tests/baselines/packaged-sample.png

  static:
    name: dead code + dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: vulture (dead code, config in pyproject)
        run: uv tool run 'vulture==2.16'

      - name: deptry (dependency hygiene, config in pyproject)
        run: uv tool run 'deptry==0.25.1' .

  links:
    name: markdown links (offline, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lychee (local file links; external links are not fetched)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --exclude-path node_modules --exclude-path .venv
            --exclude-path data --exclude-path dist
            --exclude-path bench/runs --exclude-path .git
            --exclude-path .pytest_cache --exclude-path .ruff_cache
            './**/*.md'

  prose:
    name: Vale (house voice, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          # Advisory: report style, never fail the PR (see .vale.ini).
          # No `files` input: a multi-path value is rejected by the action
          # (it falls back to 'all' anyway), and Vale already scopes to
          # markdown in .vale.ini.
          fail_on_error: false
          version: 3.23.0
