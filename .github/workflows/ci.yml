name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly heartbeat for the Play-Nice pin. GitHub fires schedules only
  # on the default branch. Monday 06:17 UTC matches personal-world's cadence.
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes (2026-10-17: ~35 min/day went to stale runs). Pushes to
# main are grouped by commit, so a main run is never cancelled: it is the check of two merges landing together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Honest-claims gate. A strong claim (a count, a pass/fail, a "nothing
  # found") must ship the command that produced it and the observed output.
  # The policy is owned by ci-harness and fetched at the revision pinned here,
  # so there is exactly one copy of it in the estate rather than one per repo.
  #
  # policy-revision MUST equal the SHA in the uses: line below. There is no
  # context property that exposes a reusable workflow's own ref, so the SHA is
  # stated twice; the template verifies after checkout that the tree it fetched
  # really is this commit, and prints both.
  claims:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-claims-policy.yml@5e96d2edfb91c999966385340e26ae574e277274
    with:
      policy-revision: 184a81393a1b26d8ca3d60eed4428cefa8ab1cc2
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}

  # Play-Nice contract currency — enforced, not decorative. This repo declared
  # adoption in .project/contracts/adoption.yaml; nothing was checking the pin, so it could silently
  # fall behind the contracts it claims to be held to.
  #
  # Fails closed: green only on CURRENT. BEHIND/DIVERGED exit 1;
  # UNREACHABLE/UNKNOWN exit 2. PRs warn so unrelated work is not blocked;
  # the weekly schedule is the blocking heartbeat, and any push to the default
  # branch is strict too. Harness-owned mechanics, repo-owned manifest path.
  contract-freshness:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-contract-freshness.yml@5e96d2edfb91c999966385340e26ae574e277274
    with:
      manifest-path: ".project/contracts/adoption.yaml"
      expect: ${{ github.event_name == 'pull_request' && 'warn' || 'current' }}
  gate:
    name: ruff + pytest + sample-world + public-surface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history is needed for the Storyteller-WIP-aware
          # public-surface guard and for any future gitleaks step.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync test deps
        run: uv sync --group test

      - name: Ruff
        run: uv run --group test ruff check src tests scripts

      - name: Install node dev deps (test harnesses only)
        # package.json is dev-only tooling (jsdom for the kitchen
        # harness). Nothing in it ships or runs at runtime.
        run: npm ci

      # Parallel (Rylee, 2026-10-10: "Please let's be as kind with my time as we are with my budget"): this
      # step took 12.6 min serially. `-n auto` uses every core the runner has (GitHub's hosted runners have
      # 2); pytest-xdist is added for this run only, so uv.lock is unchanged. Rollback: drop `--with
      # pytest-xdist` and `-n auto`.
      #
      # VEFR_REFACTOR is the behaviour-neutral claim (vefr#529): a PR labelled
      # `refactor` must weave the same bytes its merge base weaves, measured in
      # a temp worktree at `git merge-base HEAD origin/main` by
      # tests/weave_digest.py. The full history above is what makes that
      # merge base exist here. Nothing is committed for it, so two player PRs
      # cannot collide on a digest line. Every other PR gets '' and the guard
      # skips with its reason.
      - name: Pytest (blocks CI)
        env:
          VEFR_REFACTOR: ${{ contains(github.event.pull_request.labels.*.name, 'refactor') && '1' || '' }}
        run: uv run --group test --with pytest-xdist pytest -q -n auto

      - name: Validate sample-world
        run: uv run --group test norns validate --pack worlds/sample-world

      - name: Public-surface guard
        run: python3 scripts/check_public_surface.py
