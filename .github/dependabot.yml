# Estate dependabot template (agent-platform docs/ops/dependabot.md, 2026-10-27):
# - minor + patch arrive as ONE grouped PR per ecosystem; a major arrives as its own PR;
# - security updates are grouped too, and are not delayed by the cooldown;
# - a 3-day cooldown (14 for majors) lets a bad release get yanked before it reaches us;
# - docs/archive/** is frozen history and never gets a bump;
# - monthly (not a live service), on monday: each repo has its own weekday,
#   so the estate's shared runners do not get every repo's PRs on the same morning.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
