[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vefr"
version = "2.1.0"
description = "vefr - a rumor engine for playable worlds. Weaves whichever story you give it. Take the bones, grow your own flesh."
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "pydantic>=2.10",
    # The Lorekeeper's vector index (src/vefr/lore_shell.py). Bundled: `ask`
    # still falls back to a brute-force cosine if the extension fails to
    # load, so a fact is never lost to it.
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
test = [
    "hypothesis>=6.100",
    "jsonschema>=4.26.0",
    "playwright>=1.63.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The gate catches dead code and real errors mechanically; style
# rules stay off - the pytest suite covers behavior, and style
# churn in engine files isn't the point.
select = ["E4", "E7", "E9", "F"]

[project.scripts]
vefr = "vefr.cli:vefr_main"
ratatoskr = "vefr.cli:ratatoskr_main"
norns = "vefr.cli:norns_main"
vefr-lore = "vefr.lore_shell:main"
vefr-interface = "vefr.interface:main"
vefr-story = "vefr.narrate:main"

[tool.pytest.ini_options]
filterwarnings = [
    # Starlette's TestClient re-exports httpx; httpx2 is the official
    # replacement but fastapi hasn't migrated yet.  Cosmetic only —
    # no functional impact.  Silenced to keep the warning budget at zero.
    "ignore:.*httpx.*starlette.*:UserWarning",
]

[tool.vulture]
# Dead-code check (CI: `uv tool run vulture`). Confidence 90 keeps it
# signal-only; the ignored names are protocol signatures, not dead code:
# pydantic's `cls`, a context manager's `exc_type`/`tb`, and spark_call's
# public `model_cls` keyword.
min_confidence = 90
paths = ["src/vefr"]
ignore_names = ["cls", "exc_type", "tb", "model_cls"]

[tool.deptry]
# Extend (not replace) deptry's defaults, so .venv/node_modules stay out.
# bench/ and design/ are exploratory tooling with their own ad-hoc,
# often-optional deps (numpy, torch, whisper, ...) that are deliberately
# not project dependencies.
# tools/ holds dev tools run with `uv run --with <dep>` (the art importer needs Pillow).
extend_exclude = ["bench", "experiments", "design", "storyteller_packs", "worlds", "tools"]
known_first_party = ["vefr"]

[tool.deptry.per_rule_ignores]
# uvicorn is run as a CLI (`uv run uvicorn ...`), never imported.
DEP002 = ["uvicorn"]
# playwright ships in the `test` group; scripts/ is dev tooling.
DEP004 = ["playwright"]
# hatchling is the build backend ([build-system] requires); only hatch_build.py, the build hook,
# imports it, at build time, never at runtime (vefr#523).
DEP001 = ["hatchling"]

[tool.hatch.build.hooks.custom]
# web/packaged.html is generated from web/player/parts/ and is never
# committed (vefr#523), so the hook builds it before any target collects
# its files - otherwise the wheel's force-include below has nothing to
# pick up and `pip install vefr @ git+...` ships no player.
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vefr"]

[tool.hatch.build.targets.wheel.force-include]
# weave's player template ships as package data so a pip-installed
# engine can weave from a pack author's repo (site-packages/vefr/web/).
# Generated by the hook above, not committed.
"web/packaged.html" = "vefr/web/packaged.html"
"web/art/illustrations/player-title.webp" = "vefr/web/art/illustrations/player-title.webp"
"web/fonts/Cinzel-Variable.woff2" = "vefr/web/fonts/Cinzel-Variable.woff2"
"web/fonts/AtkinsonHyperlegibleNext-Regular.woff2" = "vefr/web/fonts/AtkinsonHyperlegibleNext-Regular.woff2"
"web/fonts/AtkinsonHyperlegibleNext-Bold.woff2" = "vefr/web/fonts/AtkinsonHyperlegibleNext-Bold.woff2"
