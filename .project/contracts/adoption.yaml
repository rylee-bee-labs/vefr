notes: >-
  VEFR remains its own architecture: bring-your-own-brain, worlds as data,
  maplab as the geometry/contract validator. Behavioral authority resolves
  to Play-Nice. Project-specific truth (world-pack shape, brain-socket seam,
  ratatoskr/norns CLIs, deterministic loading, sample-world pack) lives in
  the repo and remains untouched by this adoption. World/content/game-
  specific contracts stay local. VEFR does NOT inherit Personal World's
  visual design — its own accessibility contract and parchment aesthetic
  govern locally.